<svg xmlns="http://www.w3.org/2000/svg" width="540" height="236" viewBox="0 0 540 236">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111b"/>
      <stop offset="100%" stop-color="#102338"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d2435"/>
      <stop offset="100%" stop-color="#15344c"/>
    </linearGradient>
  </defs>

  <rect width="540" height="236" rx="22" fill="url(#bg)"/>
  <rect x="12" y="12" width="516" height="212" rx="18" fill="none" stroke="#28d7ff" stroke-width="2"/>
  <rect x="30" y="32" width="480" height="172" rx="18" fill="url(#panel)" stroke="#27c9f2" stroke-width="1.5"/>

  <rect x="54" y="58" width="118" height="118" rx="14" fill="#06111c" stroke="#ffcb4a" stroke-width="2"/>
  <g fill="#8beaff">
    <rect x="74" y="116" width="18" height="24" rx="3"/>
    <rect x="90" y="104" width="18" height="24" rx="3"/>
    <rect x="106" y="96" width="18" height="24" rx="3"/>
    <rect x="122" y="104" width="18" height="24" rx="3"/>
    <rect x="138" y="116" width="18" height="24" rx="3"/>
  </g>
  <text x="113" y="84" fill="#ffcb4a" font-size="14" font-family="monospace" text-anchor="middle" font-weight="700">ROYAL</text>

  <text x="204" y="92" fill="#f6fbff" font-size="28" font-family="monospace" font-weight="700">The house breaks clean.</text>
  <text x="204" y="126" fill="#9ed5e9" font-size="18" font-family="monospace">Royal Flush secured during the run.</text>
  <text x="204" y="152" fill="#9ed5e9" font-size="18" font-family="monospace">The exit opens and stays open behind you.</text>
  <text x="204" y="178" fill="#9ed5e9" font-size="18" font-family="monospace">You leave with the right ending.</text>

  <rect x="204" y="190" width="260" height="10" rx="5" fill="#0d3144"/>
  <rect x="204" y="190" width="218" height="10" rx="5" fill="#2fddff"/>
</svg>
